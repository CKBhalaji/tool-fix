services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: toolfix
      POSTGRES_PASSWORD: toolfix
      POSTGRES_DB: toolfix
    ports:
      - "5432:5432"
    volumes:
      - toolfix_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toolfix -d toolfix"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://toolfix:toolfix@postgres:5432/toolfix
      TOOLFIX_HOST: 0.0.0.0
      TOOLFIX_PORT: "8080"
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    volumes:
      - toolfix_storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
    ports:
      - "3000:3000"

volumes:
  toolfix_pgdata:
  toolfix_storage:

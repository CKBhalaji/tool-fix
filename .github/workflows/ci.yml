name: CI

on:
  push:
    branches: [dev, main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (build, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: toolfix
          POSTGRES_PASSWORD: toolfix
          POSTGRES_DB: toolfix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U toolfix"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Build
        run: cargo build --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --locked
      - name: Persistence round-trip tests (PostgreSQL)
        run: cargo test --workspace --locked -- --ignored
        env:
          DATABASE_URL: postgres://toolfix:toolfix@localhost:5432/toolfix
          TOOLFIX_TEST_DATABASE_URL: postgres://toolfix:toolfix@localhost:5432/toolfix

  frontend:
    name: Frontend (pnpm build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_WS_URL: ws://localhost:8080
      - name: Lint
        run: pnpm lint
